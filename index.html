<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shop</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #444;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 20px;
        }

        h2 {
            margin-top: 30px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        #category-filters {
            margin-bottom: 20px;
        }

        #category-filters button {
            margin: 5px;
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: contain;
        }

        .cart-item {
            background-color: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        #shopping-cart {
            margin-top: 40px;
        }

        #cart-total {
            font-size: 20px;
            font-weight: bold;
        }

        #error-message {
            color: red;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
            margin-top: 40px;
        }

    </style>

</head>

<body>

    <header>
        <h1>My Online Shop</h1>
        <p>Welcome to my online shopping website!</p>
    </header>

    <nav>
        <a href="#shop">Shop</a>
        <a href="#shopping-cart">
            Cart (<span id="cart-count">0</span>)
        </a>
    </nav>

    <main>

        <section id="shop">

            <h2>Available Products</h2>

            <p id="loading-message">Loading products...</p>

            <p id="error-message" role="alert"></p>

            <div id="category-filters"></div>

            <div id="product-grid"></div>

        </section>

        <section id="shopping-cart">

            <h2>Shopping Cart</h2>

            <div id="cart-items">
                <p>Your cart is currently empty.</p>
            </div>

            <p id="cart-total">Total: $0.00</p>

        </section>

    </main>

    <footer>
        <p>Online Shop Final Project - CST310</p>
    </footer>

    <script type="module" src="app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Online Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        #cart-count {
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 50%;
        }

        #category-filters {
            margin: 20px 0;
        }

        #category-filters button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .product-card button {
            background-color: #333;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .product-card button:hover {
            background-color: #555;
        }
    </style>

</head>

<body>

    <header>

        <h1>Welcome to My Online Shop</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#shop">Shop</a>
            <a href="#cart">Cart</a>

            <span id="cart-count">0</span>
        </nav>

    </header>

    <main>

        <section id="shop">

            <h2>Our Products</h2>

            <p>Browse our available products below.</p>

            <!-- Category filter buttons will appear here -->
            <div id="category-filters"></div>

            <!-- Product cards will appear here -->
            <div id="product-grid"></div>

        </section>

        <section id="cart">

            <h2>Your Shopping Cart</h2>

            <p>Items in cart: <span id="cart-display">0</span></p>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
